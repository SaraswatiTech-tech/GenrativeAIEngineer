<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bank Application</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <div class="logo">
        🏦
    </div>

    <h2>Bank Application</h2>

    <form method="POST">

        <div class="input-box">
            <input
            type="text"
            name="holder_name"
            placeholder="Enter Holder Name"
            required>
        </div>

        <div class="input-box">
            <input
            type="number"
            name="account_number"
            placeholder="Enter Account Number"
            required>
        </div>

        <div class="input-box">
            <input
            type="number"
            step="0.01"
            name="account_balance"
            placeholder="Enter Account Balance"
            required>
        </div>

        <div class="input-box">
            <input
            type="number"
            step="0.01"
            name="deposit_amount"
            placeholder="Enter Deposit Amount"
            required>
        </div>

        <div class="input-box">
            <input
            type="number"
            step="0.01"
            name="withdrawal_amount"
            placeholder="Enter Withdrawal Amount"
            required>
        </div>

        <div class="checkbox-box">

            <input
            type="checkbox"
            name="account_active">

            <label>
                Account Active
            </label>

        </div>

        <button type="submit">
            Submit
        </button>

    </form>

    {% if message %}
        <div class="message">
            {{ message }}
        </div>
    {% endif %}

</div>

</body>
</html>
